</style></head><body><div class="shop">

 for(let j=0;j<N;j++){o+=pg([P(0,j,0),P(N,j,0),P(N,j+1,0),P(0,j+1,0)],j%2?'#82552a':'#744a22','stroke="#4f2f13" stroke-opacity=".5" stroke-width=".6"');[(j*3.7)%N,(j*3.7+5)%N].forEach(x=>o+=ln(P(x,j,0),P(x,j+1,0),'#4f2f13',.7))}

  wl('L',3.7,3.9,'<g fill="none" stroke="#f1ede2" stroke-width="1.6" stroke-linecap="round"><path d="M0,8h26v14a13,13 0 0 1 -13,13h0a13,13 0 0 1 -13,-13z"/><path d="M26,13h5a5,5 0 0 1 0,10h-5"/><path d="M7,-2q-4,-5 0,-9M14,-2q-4,-5 0,-9M21,-2q-4,-5 0,-9"/></g>');

 <h2>🏆 Món được gọi nhiều nhất</h2>`+(list.length?list.map(([k,v],i)=>`<div style="margin-bottom:10px"><div class="row" style="margin:0"><span>${medal[i]||(i+1)+'.'} ${esc(k)}${badge(k,v)}</span><span class="fix"><b>${v}</b> ly</span></div><div class="bar" style="width:${v/max*100}%"></div></div>`).join(''):'<p class="mu">Chưa có đơn nào trong khoảng này.</p>')+race+

 <div class="card"><h2>👑 Người uống nhiều nhất</h2>`+(people.length?'<table>'+people.map(([k,v],i)=>`<tr><td>${i?i+1+'.':'👑'} ${esc(k)}</td><td class="r">${v.c} ly</td><td class="r">${money(v.t)}</td></tr>`).join('')+'</table>':'<p class="mu">Chưa có dữ liệu.</p>')+`</div>
 <div class="card"><h2>👻 Món bị bỏ rơi</h2>`+(ghosts.length?'<p>Hơn 30 ngày chưa ai gọi: '+ghosts.map(esc).join(', ')+'. Thương chúng một chút nhé!</p>':'<p class="mu">Món nào cũng có người gọi gần đây. Không ai bị bỏ rơi.</p>')+'</div>';
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{rankP=b.dataset.p;rRank()});
}
load();setInterval(load,20000);
</script></body></html>
