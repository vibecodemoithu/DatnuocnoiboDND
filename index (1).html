<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt nước nội bộ</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#8a7f72;--ac:#c2571a;--acx:#fff;--bd:#e7dfd3}
@media (prefers-color-scheme:dark){:root{--bg:#1c1915;--card:#27231e;--tx:#f1ebe2;--mu:#a1968a;--ac:#e8803f;--acx:#1c1915;--bd:#3a342c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{flex:1;min-width:90px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.sm{padding:3px 8px;font-size:13px}
input,select{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;border-radius:8px;width:100%;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.drink{cursor:pointer;margin:0}.drink:hover{border-color:var(--ac)}.drink b{display:block}
.mu{color:var(--mu);font-size:13px}.price{color:var(--ac);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row>*{flex:1}.row>.fix{flex:none}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}td.r,th.r{text-align:right}.tot td{font-weight:700;border-bottom:0}
.wrap{overflow-x:auto}.hide{display:none}
</style></head><body><main>
<h1>🧋 Đặt nước nội bộ</h1>
<div class="row"><input id="who" placeholder="Tên của bạn (để ghi đơn)"></div>
<div class="tabs"><button data-t="menu" class="on">Chọn món</button><button data-t="today">Hôm nay</button><button data-t="hist">Lịch sử</button><button data-t="adm">Quản lý</button></div>
<section id="menu"></section><section id="today" class="hide"></section><section id="hist" class="hide"></section><section id="adm" class="hide"></section>
<p class="mu" id="msg"></p>
</main>
<script>
const API='DÁN_LINK_WEB_APP_VÀO_ĐÂY'; // link dạng https://script.google.com/macros/s/.../exec
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n||0).toLocaleString('vi-VN')+'đ';
const unitP=n=>(Math.round((n||0)*100)/100).toLocaleString('vi-VN')+'đ';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let ING=[],DR=[],OR=[],sel=null,histDate=today(),tab='menu',PIN='',unlocked=false,editIng=null;
try{$('#who').value=localStorage.getItem('who')||'';PIN=localStorage.getItem('pin')||''}catch(e){}
$('#who').addEventListener('input',e=>{try{localStorage.setItem('who',e.target.value)}catch(_){}});
window.alert=m=>{let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:12px;background:var(--ac);color:var(--acx);padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.3)';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)};
const twice=(b,fn)=>{if(b.dataset.arm){fn();return}b.dataset.arm=1;const o=b.textContent;b.textContent='Bấm lại để xoá';setTimeout(()=>{delete b.dataset.arm;b.textContent=o},3000)};
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,pin:PIN})});const j=await r.json();if(j.error)throw new Error(j.error);return j}
const w=async fn=>{try{await fn();await load()}catch(e){alert('Lỗi: '+(e.message||e))}};
async function load(){try{const j=await (await fetch(API)).json();ING=j.ingredients.sort((a,b)=>a.name.localeCompare(b.name));DR=j.drinks.sort((a,b)=>a.name.localeCompare(b.name));OR=j.orders.sort((a,b)=>b.ts-a.ts);$('#msg').textContent=''}catch(e){$('#msg').textContent='Không kết nối được Google Sheet. Kiểm tra lại link API trong file.'}
 if(!(tab==='adm'&&document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['menu','today','hist','adm'].forEach(t=>$('#'+t).classList.toggle('hide',t!==tab));render()});
const ing=id=>ING.find(i=>i.id===id);
function cost(d){let t=0;const lines=(d.items||[]).map(it=>{const g=ing(it.ing),p=g?g.price*it.qty:0;t+=p;return{name:g?g.name:'(đã xoá)',unit:g?g.unit:'',qty:it.qty,price:g?g.price:0,sum:p}});return{t,lines}}
function render(){if(tab==='menu')rMenu();if(tab==='today')rToday();if(tab==='hist')rHist();if(tab==='adm')rAdm()}
function rMenu(){
 let h=DR.length?'<div class="grid">'+DR.map(d=>`<div class="card drink" data-id="${esc(d.id)}"><b>${esc(d.name)}</b><span class="price">${money(cost(d).t)}</span></div>`).join('')+'</div>':'<p class="mu">Chưa có món nào. Người quản lý vào tab “Quản lý” để thêm.</p>';
 const d=DR.find(x=>x.id===sel);
 if(d){const c=cost(d);h+=`<div class="card"><h2>${esc(d.name)}</h2><div class="wrap"><table><tr><th>Nguyên liệu</th><th class="r">Số lượng</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr>`+c.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="r">${l.qty} ${esc(l.unit)}</td><td class="r">${unitP(l.price)}/${esc(l.unit)}</td><td class="r">${money(l.sum)}</td></tr>`).join('')+`<tr class="tot"><td colspan="3">Tổng tiền</td><td class="r">${money(c.t)}</td></tr></table></div><div class="row" style="margin-top:10px"><input id="note" placeholder="Ghi chú (ít đá, 50% đường…)"><button class="pri fix" id="order">Đặt món này</button></div></div>`}
 $('#menu').innerHTML=h;
 document.querySelectorAll('.drink').forEach(e=>e.onclick=()=>{sel=e.dataset.id;rMenu();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});
 const ob=$('#order');if(ob)ob.onclick=()=>{const name=$('#who').value.trim();if(!name){alert('Nhập tên của bạn ở phía trên trước nhé.');return}
  ob.disabled=true;w(async()=>{await api({action:'addOrder',data:{date:today(),name,drinkId:d.id,drink:d.name,total:cost(d).t,note:$('#note').value.trim()}});sel=null;alert('Đã đặt: '+d.name)}).finally(()=>ob.disabled=false)}
}
function ordersTable(list,canDel){
 if(!list.length)return '<p class="mu">Chưa có đơn nào.</p>';
 return '<div class="wrap"><table><tr><th>Người</th><th>Món</th><th>Ghi chú</th><th class="r">Tiền</th>'+(canDel?'<th></th>':'')+'</tr>'+list.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.drink)}</td><td class="mu">${esc(o.note)}</td><td class="r">${money(o.total)}</td>${canDel?`<td><button class="sm" data-del="${esc(o.id)}">Xoá</button></td>`:''}</tr>`).join('')+`<tr class="tot"><td colspan="3">${list.length} đơn</td><td class="r">${money(list.reduce((a,o)=>a+Number(o.total),0))}</td>${canDel?'<td></td>':''}</tr></table></div>`}
const bindDel=()=>document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>twice(b,()=>w(()=>api({action:'del',sheet:'Orders',id:b.dataset.del}))));
function rToday(){const l=OR.filter(o=>o.date===today()),by={};l.forEach(o=>by[o.drink]=(by[o.drink]||0)+1);
 $('#today').innerHTML=`<div class="card"><h2>Đơn hôm nay (${today().split('-').reverse().join('/')})</h2>${ordersTable(l,unlocked)}`+(l.length?'<p class="mu">Tổng hợp: '+Object.entries(by).map(([k,v])=>esc(k)+' ×'+v).join(' · ')+'</p>':'')+'</div>';bindDel()}
function rHist(){const bp={};OR.forEach(o=>bp[o.name]=(bp[o.name]||0)+Number(o.total));
 $('#hist').innerHTML=`<div class="card"><h2>Xem theo ngày</h2><div class="row"><input type="date" id="hd" value="${histDate}"></div>${ordersTable(OR.filter(o=>o.date===histDate),unlocked)}</div><div class="card"><h2>Tổng cộng từng người</h2>`+(Object.keys(bp).length?'<table>'+Object.entries(bp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join('')+'</table>':'<p class="mu">Chưa có dữ liệu.</p>')+'</div>';
 $('#hd').onchange=e=>{histDate=e.target.value||today();rHist()};bindDel()}
function rAdm(){
 if(!unlocked){$('#adm').innerHTML='<div class="card"><h2>Nhập mã PIN quản lý</h2><div class="row"><input id="pin" type="password" placeholder="Mã PIN" value="'+esc(PIN)+'"><button class="pri fix" id="un">Mở khoá</button></div></div>';
  $('#un').onclick=async()=>{PIN=$('#pin').value;try{await api({action:'check'});unlocked=true;try{localStorage.setItem('pin',PIN)}catch(_){}render()}catch(e){alert(e.message||'Không kết nối được')}};
  if(PIN)$('#un').click();return}
 const rid=()=>Math.random().toString(36).slice(2,9);let editId=null;
 $('#adm').innerHTML=`<div class="card"><h2>Nguyên liệu & giá nhập</h2>
 <div class="row"><input id="in" placeholder="Tên (vd: Sữa đặc)"><input id="iu" class="fix" style="width:90px" placeholder="g / ml / cái"></div>
 <div class="row"><input id="ik" type="number" min="0" step="any" placeholder="Cả gói/hộp bao nhiêu (vd: 1000)"><input id="ip" type="number" min="0" step="any" placeholder="Giá cả gói/hộp"><button class="pri fix" id="ia">Lưu</button></div>
 <p class="mu" id="pv"></p><p class="mu">Nhập khối lượng và giá cả gói/hộp, web tự tính giá cho 1 đơn vị.</p>
 <div class="wrap"><table>${ING.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.pkgSize?esc(i.pkgSize)+esc(i.unit)+' = '+money(i.pkgPrice)+' → ':''}${unitP(i.price)}/${esc(i.unit)}</td><td class="r"><button class="sm" data-ie="${esc(i.id)}">Sửa</button> <button class="sm" data-id2="${esc(i.id)}">Xoá</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Thêm / sửa món</h2><input id="dn" placeholder="Tên món (vd: Trà đào)" style="margin-bottom:8px"><div id="dl"></div><div class="row"><button class="fix" id="da">+ Nguyên liệu</button><button class="pri fix" id="ds">Lưu món</button><button class="fix" id="dc">Làm mới</button></div></div>
 <div class="card"><h2>Danh sách món</h2>${DR.map(d=>`<div class="row"><span>${esc(d.name)} <span class="price">${money(cost(d).t)}</span></span><span class="fix"><button class="sm" data-de="${esc(d.id)}">Sửa</button> <button class="sm" data-dd="${esc(d.id)}">Xoá</button></span></div>`).join('')||'<p class="mu">Chưa có món.</p>'}</div>`;
 const addLine=(v={})=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<select>${ING.map(i=>`<option value="${esc(i.id)}"${v.ing===i.id?' selected':''}>${esc(i.name)} (${esc(i.unit)})</option>`).join('')}</select><input type="number" min="0" step="any" class="fix" style="width:90px" placeholder="Số lượng" value="${v.qty??''}"><button class="sm fix">✕</button>`;r.querySelector('button').onclick=()=>r.remove();$('#dl').appendChild(r)};addLine();
 $('#da').onclick=()=>addLine();$('#dc').onclick=()=>{editId=null;$('#dn').value='';$('#dl').innerHTML='';addLine()};
 const pv=()=>{const k=parseFloat($('#ik').value),p=parseFloat($('#ip').value);$('#pv').textContent=k>0&&p>=0?'→ '+unitP(p/k)+' / '+($('#iu').value||'đơn vị'):''};['ik','ip','iu'].forEach(x=>$('#'+x).addEventListener('input',pv));
 $('#ia').onclick=()=>w(async()=>{const n=$('#in').value.trim(),u=$('#iu').value.trim(),k=parseFloat($('#ik').value),p=parseFloat($('#ip').value);if(!n||!u||!(k>0)||isNaN(p)){alert('Điền đủ tên, đơn vị, khối lượng và giá cả gói');return}await api({action:'save',sheet:'Ingredients',data:{id:editIng||rid(),name:n,unit:u,pkgSize:k,pkgPrice:p,price:p/k}});editIng=null});
 document.querySelectorAll('[data-ie]').forEach(b=>b.onclick=()=>{const i=ing(b.dataset.ie);editIng=i.id;$('#in').value=i.name;$('#iu').value=i.unit;$('#ik').value=i.pkgSize||1;$('#ip').value=i.pkgPrice||i.price;pv();alert('Sửa xong bấm Lưu')});
 document.querySelectorAll('[data-id2]').forEach(b=>b.onclick=()=>twice(b,()=>w(()=>api({action:'del',sheet:'Ingredients',id:b.dataset.id2}))));
 $('#ds').onclick=()=>w(async()=>{const n=$('#dn').value.trim(),items=[...$('#dl').children].map(r=>({ing:r.querySelector('select').value,qty:parseFloat(r.querySelector('input').value)})).filter(x=>x.ing&&x.qty>0);if(!n||!items.length){alert('Cần tên món và ít nhất 1 nguyên liệu');return}await api({action:'save',sheet:'Drinks',data:{id:editId||rid(),name:n,items}});editId=null});
 document.querySelectorAll('[data-de]').forEach(b=>b.onclick=()=>{const d=DR.find(x=>x.id===b.dataset.de);editId=d.id;$('#dn').value=d.name;$('#dl').innerHTML='';d.items.forEach(addLine);window.scrollTo({top:$('#dn').offsetTop-20,behavior:'smooth'})});
 document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>twice(b,()=>w(()=>api({action:'del',sheet:'Drinks',id:b.dataset.dd}))));
}
load();setInterval(load,20000);
</script></body></html>
